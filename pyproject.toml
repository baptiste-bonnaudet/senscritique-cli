[project]
name = "senscritique_cli"
version = "0.1.0"
description = "Senscritique Cli for Python projects"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "baptiste.bonnaudet", email = "baptiste.bonnaudet@gmail.com" },
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-cloud-logging>=3.16.1",
    "python-json-logger>=3.1",
]

[project.urls]
Homepage = "https://github.com/"
Repository = "https://github.com/"

[project.scripts]
senscritique_cli = "senscritique_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senscritique_cli"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "requests-mock>=1.12",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=senscritique_cli --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (may require external credentials)",
]

[tool.coverage.run]
source = ["senscritique_cli"]
branch = true
